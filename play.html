<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THAMBOLA TICKET</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f0f2f5; text-align: center; }
  .header { background: #1a237e; color: white; padding: 15px; font-size: 24px; font-weight: bold; border-bottom: 3px solid #ffeb3b; }
  .game-number { font-size: 16px; color: #ffeb3b; margin-top: 5px; }
  .container { padding: 20px; }
  .btn { padding: 10px 20px; font-size: 16px; color: white; background: #4caf50; border: none; border-radius: 5px; cursor: pointer; margin: 5px; font-weight: bold; transition: 0.3s; }
  .btn.blue { background: #2196f3; }
  .panel { background: white; padding: 15px; margin: 15px auto; max-width: 600px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); animation: fadeIn 0.5s; }
  .big-number { font-size: 70px; color: #d32f2f; font-weight: bold; margin: 5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
  .recent-box { background: #fff3e0; border: 2px solid #ff9800; padding: 10px; margin: 10px auto 20px; max-width: 400px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .recent-label { font-size: 16px; font-weight: bold; color: #e65100; }
  .recent-circle { width: 40px; height: 40px; border-radius: 50%; background: #ffb74d; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; border: 2px solid #f57c00; }
  .recent-circle.latest { background: #f44336; border-color: #d32f2f; transform: scale(1.1); }
  
  .ticket-wrap { border: 3px solid #6a1b9a; margin: 15px auto; background: white; max-width: 500px; position: relative; overflow: hidden;}
  .t-head { background: #f3e5f5; color: #4a148c; padding: 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
  .t-grid { display: grid; grid-template-columns: repeat(9, 1fr); border-top: 2px solid #6a1b9a; }
  .t-cell { border: 1px solid #ccc; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; user-select: none; }
  .t-cell.empty { background: #fafafa; border-color: transparent; }
  .t-cell.num { cursor: pointer; transition: 0.2s; }
  .t-cell.num:hover { background: #ffe0b2; }
  .t-cell.marked { background: #e53935 !important; color: white; }
  .t-cell.violet { background: #9c27b0 !important; color: white !important; }
  
  .claim-btn { width: 100%; padding: 12px; background: linear-gradient(45deg, #ff9800, #ff5722); color: white; border: none; font-size: 18px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;}
  .claim-btn:active { transform: scale(0.98); }
  
  .board { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(10, 1fr); grid-auto-flow: column; gap: 2px; max-width: 500px; margin: 15px auto; }
  .b-cell { background: white; border: 1px solid #999; padding: 8px 5px; font-size: 14px; font-weight: bold; transition: 0.2s; }
  .b-cell.called { background: #ffeb3b; } .b-cell.current { background: #f44336; color: white; }
  
  #player-view, #player-join-view, #game-over-view { display: none; }
  
  /* Animations & Overlays */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 80% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
  
  .cancelled-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; color: red; font-size: 30px; font-weight: bold; text-shadow: 2px 2px white; transform: rotate(-15deg); pointer-events: none; }
  .congrats-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(76, 175, 80, 0.9); display: flex; align-items: center; justify-content: center; color: white; font-size: 26px; font-weight: bold; text-shadow: 1px 1px 3px black; animation: popIn 0.5s forwards; flex-direction: column;}
  
  #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1000; }
  .toast { background: #4a148c; color: white; padding: 15px 20px; border-radius: 8px; margin-top: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); animation: slideIn 0.5s forwards; font-weight: bold; font-size: 16px; border-left: 5px solid #ffeb3b; }
  @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

  .winner-rank { background: #e8eaf6; border-left: 5px solid #3f51b5; padding: 10px; margin: 10px 0; text-align: left; }
  .winner-rank h4 { margin: 0 0 5px 0; color: #1a237e; }
</style>
</head>
<body>
<div class="header">
  THAMBOLA BOOK
  <div id="display-game-id" class="game-number"></div>
</div>

<div id="toast-container"></div>

<div id="player-join-view" class="container">
  <div class="panel">
    <h2>Welcome Player!</h2>
    <p style="color:red; font-weight:bold;">Tap the button below to join the game.</p>
    <button class="btn blue" style="padding: 15px 30px; font-size: 20px;" onclick="enterPlayerGame()">JOIN GAME NOW</button>
  </div>
</div>

<div id="player-view" class="container">
  <div class="panel">
    <h2 id="player-welcome-name"></h2>
    <div id="player-current-num" class="big-number">--</div>
    <div class="recent-box">
      <div class="recent-label">Last 5:</div>
      <div id="player-recent-nums" style="display:flex; gap:8px;"></div>
    </div>
    <div class="board" id="player-board"></div>
  </div>
  <h3>Your Tickets</h3>
  <div id="player-tickets-area"></div>
</div>

<div id="game-over-view" class="container">
  <div class="panel" style="background: #fff9c4; border: 2px solid #fbc02d;">
    <h2 style="color: #d32f2f; font-size: 30px; margin-top:0;">🏆 GAME OVER 🏆</h2>
    <h3 style="color: #333;">Winners List</h3>
    <div id="winners-list-container"></div>
    <p style="margin-top: 20px; font-weight: bold;">Thank you for playing!</p>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAvjFcKKiu4OMmQckYXMTejdBJh9tC6TjM",
    authDomain: "sri-vishnu-priya-finance-c591f.firebaseapp.com",
    databaseURL: "https://sri-vishnu-priya-finance-c591f-default-rtdb.firebaseio.com",
    projectId: "sri-vishnu-priya-finance-c591f",
    storageBucket: "sri-vishnu-priya-finance-c591f.firebasestorage.app",
    messagingSenderId: "184676228358",
    appId: "1:184676228358:web:c2b32b68debeeadadfd287"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let gameId, playerId, playerName;
  let calledNumbers = [];
  let currentDrawNumber = 0;
  let maxHousiesAllowed = 4; 
  let knownWinners = new Set();
  let rawWinnersData = {}; // Store claims to calculate ranks

  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('t');

  window.onload = () => {
    if (token) {
      try {
        let decoded = atob(token); 
        let parts = decoded.split('|');
        gameId = parts[0];
        playerId = parts[1];
        
        document.getElementById('player-join-view').style.display = 'block';
        createBoardUI();
      } catch(e) { alert("Invalid or Broken Link!"); }
    } else {
      document.body.innerHTML = "<h2 style='margin-top:50px;'>No game token found in link!</h2>";
    }
  };

  function createBoardUI() {
    let board = document.getElementById('player-board');
    board.innerHTML = '';
    for(let i=1; i<=90; i++) {
      let c = document.createElement('div');
      c.id = 'pb-' + i; c.className = 'b-cell'; c.innerText = i;
      board.appendChild(c);
    }
  }

  function showToast(message) {
    let container = document.getElementById('toast-container');
    let toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = message;
    container.appendChild(toast);
    setTimeout(() => { toast.remove(); }, 6000);
  }

  function enterPlayerGame() {
    document.getElementById('player-join-view').style.display = 'none';
    document.getElementById('player-view').style.display = 'block';
    document.getElementById('display-game-id').innerText = "Game Number: " + gameId;
    setTimeout(() => { announceVoice(""); }, 100);

    db.ref(`games/${gameId}`).once('value', snap => {
      let data = snap.val();
      if(data && data.maxHousies) maxHousiesAllowed = data.maxHousies;
    });

    db.ref(`games/${gameId}/tickets/${playerId}`).once('value', snapshot => {
      if(snapshot.exists()) {
        playerName = snapshot.val().name;
        document.getElementById('player-welcome-name').innerText = playerName + "'s Tickets";
      } else {
        document.getElementById('player-tickets-area').innerHTML = '<h3 style="color:red;">Error: Ticket not found.</h3>';
      }
    });
    listenToGameState();
  }

  function listenToGameState() {
    db.ref('games/' + gameId).on('value', snapshot => {
      let data = snapshot.val();
      if(!data) return;
      if(data.maxHousies) maxHousiesAllowed = data.maxHousies;
      
      currentDrawNumber = data.currentDraw;
      calledNumbers = data.called || [];
      
      if(currentDrawNumber > 0) {
        document.getElementById('player-current-num').innerText = currentDrawNumber;
        if (currentDrawNumber !== window.lastAnnouncedNumber) {
          announceVoice(currentDrawNumber);
          window.lastAnnouncedNumber = currentDrawNumber;
        }
        updateBoardsColors(currentDrawNumber, calledNumbers);
        updateRecentNumbersUI(calledNumbers); 
      }

      if (data.status === 'ended') {
        document.getElementById('player-view').style.display = 'none';
        displayWinners(rawWinnersData);
        document.getElementById('game-over-view').style.display = 'block';
      }
    });

    db.ref(`games/${gameId}/tickets/${playerId}`).on('value', snapshot => {
      document.getElementById('player-tickets-area').innerHTML = '';
      if(snapshot.exists()) {
        renderTickets(snapshot.val().data, snapshot.val().name);
      } else {
        document.getElementById('player-tickets-area').innerHTML = '<h3 style="color:red; text-align:center;">Tickets have been Cancelled.</h3>';
      }
    });

    // Listen for global winners
    db.ref(`games/${gameId}/winners`).on('child_added', snap => {
      let winner = snap.val();
      rawWinnersData[snap.key] = winner;
      if(!knownWinners.has(snap.key)) {
        knownWinners.add(snap.key);
        showToast(`🎉 <b>${winner.name}</b> Claimed Housie!<br>Time: ${winner.time}`);
      }
    });
  }

  function announceVoice(text) {
    if ('speechSynthesis' in window) {
      setTimeout(() => {
        window.speechSynthesis.cancel();
        let msg = new SpeechSynthesisUtterance(typeof text === 'number' ? "Number is " + text : text);
        msg.lang = 'en-IN'; msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
      }, 10);
    }
  }

  function updateRecentNumbersUI(calledArray) {
    let actualCalls = calledArray.filter(n => n > 0);
    let last5 = actualCalls.slice(-5).reverse(); 
    let html = '';
    last5.forEach((num, index) => html += `<div class="recent-circle${index===0?' latest':''}">${num}</div>`);
    document.getElementById('player-recent-nums').innerHTML = html;
  }

  function updateBoardsColors(current, calledArray) {
    for(let i=1; i<=90; i++) {
      let pCell = document.getElementById('pb-'+i);
      if(pCell) {
        pCell.className = 'b-cell';
        if(i === current) pCell.classList.add('current');
        else if(calledArray.includes(i)) pCell.classList.add('called');
      }
    }
  }

  // --- CLAIM HOUSIE LOGIC ---
  function claimHousie(ticketIndex, tObj) {
    let ticketDiv = document.querySelectorAll('.ticket-wrap')[ticketIndex];
    if(ticketDiv.querySelector('.congrats-overlay') || ticketDiv.querySelector('.cancelled-overlay')) return; // Already claimed or cancelled

    let numberCells = ticketDiv.querySelectorAll('.t-cell.num');
    let allValid = true;
    let wrongMarkedNums = [];

    numberCells.forEach(cell => {
      let num = parseInt(cell.innerText);
      let isMarked = cell.classList.contains('marked');
      let isCalled = calledNumbers.includes(num);

      if (!isCalled) {
        allValid = false;
        if (isMarked) wrongMarkedNums.push(num); // They marked a wrong number!
      } else {
        if (!isMarked) allValid = false; // They forgot to mark a called number
      }
    });

    if (allValid) {
      // Genuine Housie!
      let now = new Date();
      let timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0') + ":" + now.getSeconds().toString().padStart(2, '0');
      
      db.ref(`games/${gameId}/winners`).push({
        name: playerName,
        tNum: tObj.tNum,
        draw: currentDrawNumber, // Save which draw they won on for tie-breaking
        time: timeStr
      });
      
      ticketDiv.innerHTML += `<div class="congrats-overlay">🎉 CONGRATULATIONS! 🎉<br><span style="font-size:16px;">Time: ${timeStr}</span></div>`;
    } else {
      // False Claim!
      alert("Wrong Housie! You missed numbers or marked wrong numbers. Ticket Cancelled.");
      
      // Update DB to show it's cancelled and which numbers were wrong
      db.ref(`games/${gameId}/tickets/${playerId}/data/${ticketIndex}`).update({
        cancelled: true,
        wrongMarks: wrongMarkedNums
      });
    }
  }

  function renderTickets(ticketsArray, name) {
    let container = document.getElementById('player-tickets-area');
    ticketsArray.forEach((tObj, index) => {
      let wrap = document.createElement('div'); wrap.className = 'ticket-wrap';
      
      if(tObj.cancelled) wrap.innerHTML += `<div class="cancelled-overlay">CANCELLED</div>`;
      // We check if this specific ticket is already in winners (local UI check)
      let isWinnerLocally = Object.values(rawWinnersData).find(w => w.name === name && w.tNum === tObj.tNum);
      if(isWinnerLocally) wrap.innerHTML += `<div class="congrats-overlay">🎉 CONGRATULATIONS! 🎉<br><span style="font-size:16px;">Time: ${isWinnerLocally.time}</span></div>`;

      let head = document.createElement('div'); head.className = 't-head'; head.innerHTML = `<span>${name} - Ticket ${tObj.tNum}</span>`;
      let grid = document.createElement('div'); grid.className = 't-grid';
      
      for(let r=0; r<3; r++) {
        for(let c=0; c<9; c++) {
          let cell = document.createElement('div');
          if(tObj.grid[r][c] === 0) { 
            cell.className = 't-cell empty'; 
          } else { 
            cell.className = 't-cell num'; 
            cell.innerText = tObj.grid[r][c]; 
            
            if(tObj.wrongMarks && tObj.wrongMarks.includes(tObj.grid[r][c])) {
              cell.classList.add('violet');
            }

            cell.onclick = function() {
              if (this.classList.contains('marked')) {
                if (confirm("Ee number ni un-tick (deselect) cheyalanukuntunnara?")) this.classList.remove('marked');
              } else {
                this.classList.add('marked');
              }
            };
          }
          grid.appendChild(cell);
        }
      }
      
      let claimBtn = document.createElement('button');
      claimBtn.className = 'claim-btn';
      claimBtn.innerText = "HOUSIE FULL";
      claimBtn.onclick = () => claimHousie(index, tObj);

      wrap.appendChild(head); wrap.appendChild(grid); wrap.appendChild(claimBtn);
      container.appendChild(wrap);
    });
  }

  // Calculate Ranks considering Ties based on draw number
  function displayWinners(winnersData) {
    let container = document.getElementById('winners-list-container');
    container.innerHTML = '';
    
    let claims = Object.values(winnersData || {});
    if(claims.length === 0) {
      container.innerHTML = '<p>No one claimed a valid Housie in this game.</p>';
      return;
    }

    // Group claims by the draw number they were claimed on
    let grouped = {};
    claims.forEach(c => {
      if(!grouped[c.draw]) grouped[c.draw] = [];
      grouped[c.draw].push(c);
    });

    // Sort the draw numbers based on when they were actually called
    let drawsInOrder = Object.keys(grouped).sort((a,b) => {
      return calledNumbers.indexOf(parseInt(a)) - calledNumbers.indexOf(parseInt(b));
    });

    let rank = 1;
    let rankNames = ["1st Housie", "2nd Housie", "3rd Housie", "4th Housie", "5th Housie", "6th Housie", "7th Housie", "8th Housie", "9th Housie", "10th Housie"];

    for(let d of drawsInOrder) {
      if(rank > maxHousiesAllowed) break; // Stop showing if we exceeded max housies setup by host

      let playersInRank = grouped[d];
      let rankTitle = rankNames[rank-1] || `${rank}th Housie`;
      let sharedText = playersInRank.length > 1 ? " <span style='color:red;'>(Shared Prize)</span>" : "";

      let html = `<div class="winner-rank">
                    <h4>${rankTitle}${sharedText}</h4>
                    <ul style="margin:5px 0; padding-left: 20px;">`;
      
      playersInRank.forEach(p => {
        html += `<li><b>${p.name}</b> (Ticket ${p.tNum}) - Claimed at ${p.time}</li>`;
      });
      html += `</ul></div>`;
      container.innerHTML += html;
      
      rank++;
    }
  }
</script>
</body>
</html>
