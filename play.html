<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THAMBOLA TICKET</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f0f2f5; text-align: center; }
  .header { background: #1a237e; color: white; padding: 15px; font-size: 24px; font-weight: bold; border-bottom: 3px solid #ffeb3b; }
  .game-number { font-size: 16px; color: #ffeb3b; margin-top: 5px; }
  .container { padding: 20px; }
  .btn { padding: 10px 20px; font-size: 16px; color: white; background: #4caf50; border: none; border-radius: 5px; cursor: pointer; margin: 5px; font-weight: bold; transition: 0.3s; }
  .btn.blue { background: #2196f3; }
  .panel { background: white; padding: 15px; margin: 15px auto; max-width: 600px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
  .big-number { font-size: 70px; color: #d32f2f; font-weight: bold; margin: 5px; }
  .recent-box { background: #fff3e0; border: 2px solid #ff9800; padding: 10px; margin: 10px auto 20px; max-width: 400px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .recent-label { font-size: 16px; font-weight: bold; color: #e65100; }
  .recent-circle { width: 40px; height: 40px; border-radius: 50%; background: #ffb74d; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; border: 2px solid #f57c00; }
  .recent-circle.latest { background: #f44336; border-color: #d32f2f; }
  .ticket-wrap { border: 3px solid #6a1b9a; margin: 15px auto; background: white; max-width: 500px; }
  .t-head { background: #f3e5f5; color: #4a148c; padding: 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
  .t-grid { display: grid; grid-template-columns: repeat(9, 1fr); border-top: 2px solid #6a1b9a; }
  .t-cell { border: 1px solid #ccc; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; user-select: none; }
  .t-cell.empty { background: #fafafa; border-color: transparent; }
  .t-cell.num { cursor: pointer; transition: 0.2s; }
  .t-cell.num:hover { background: #ffe0b2; }
  .t-cell.marked { background: #e53935 !important; color: white; }
  .board { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(10, 1fr); grid-auto-flow: column; gap: 2px; max-width: 500px; margin: 15px auto; }
  .b-cell { background: white; border: 1px solid #999; padding: 8px 5px; font-size: 14px; font-weight: bold; transition: 0.2s; }
  .b-cell.called { background: #ffeb3b; } .b-cell.current { background: #f44336; color: white; }
  #player-view, #player-join-view, #game-over-view { display: none; }
  .game-time-display { font-size: 18px; color: #1a237e; background: #e8eaf6; padding: 10px; border-radius: 5px; border: 1px solid #3f51b5; margin-bottom: 15px; font-weight: bold; display: none; }
</style>
</head>
<body>
<div class="header">
  THAMBOLA BOOK
  <div id="display-game-id" class="game-number"></div>
</div>

<div id="player-join-view" class="container">
  <div class="panel">
    <h2>Welcome Player!</h2>
    <div id="player-time-display" class="game-time-display"></div>
    <p style="color:red; font-weight:bold;">Tap the button below to join the game.</p>
    <button class="btn blue" style="padding: 15px 30px; font-size: 20px;" onclick="enterPlayerGame()">JOIN GAME NOW</button>
  </div>
</div>

<div id="player-view" class="container">
  <div class="panel">
    <h2 id="player-welcome-name"></h2>
    <div id="player-current-num" class="big-number">--</div>
    <div class="recent-box">
      <div class="recent-label">Last 5:</div>
      <div id="player-recent-nums" style="display:flex; gap:8px;"></div>
    </div>
    <div class="board" id="player-board"></div>
  </div>
  <h3>Your Tickets (Tap to Tick)</h3>
  <div id="player-tickets-area"></div>
</div>

<div id="game-over-view" class="container">
  <div class="panel">
    <h2 style="color: #d32f2f; font-size: 30px;">GAME OVER</h2>
    <p style="font-size: 18px; font-weight: bold;">This game has been ended by the Host.</p>
    <p>Please wait in your WhatsApp group for the next game link!</p>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAvjFcKKiu4OMmQckYXMTejdBJh9tC6TjM",
    authDomain: "sri-vishnu-priya-finance-c591f.firebaseapp.com",
    databaseURL: "https://sri-vishnu-priya-finance-c591f-default-rtdb.firebaseio.com",
    projectId: "sri-vishnu-priya-finance-c591f",
    storageBucket: "sri-vishnu-priya-finance-c591f.firebasestorage.app",
    messagingSenderId: "184676228358",
    appId: "1:184676228358:web:c2b32b68debeeadadfd287"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let gameId, playerId;
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('t');

  window.onload = () => {
    if (token) {
      try {
        let decoded = atob(token); // Decode Base64 hidden data
        let parts = decoded.split('|');
        gameId = parts[0];
        playerId = parts[1];
        
        document.getElementById('player-join-view').style.display = 'block';
        createBoardUI();
        fetchGameInfoForPlayer(); 
      } catch(e) {
        alert("Invalid or Broken Link!");
      }
    } else {
      document.body.innerHTML = "<h2 style='margin-top:50px;'>No game token found in link!</h2>";
    }
  };

  function formatAMPM(timeString) {
    if (!timeString) return '';
    const [hours, minutes] = timeString.split(':');
    let h = parseInt(hours);
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; h = h ? h : 12; 
    return `${h}:${minutes} ${ampm}`;
  }

  function fetchGameInfoForPlayer() {
    db.ref('games/' + gameId).once('value', snapshot => {
      let data = snapshot.val();
      if(data && data.startTime) {
        let displayTime = formatAMPM(data.startTime);
        let timeDiv = document.getElementById('player-time-display');
        timeDiv.innerText = "Game Starts At: " + displayTime;
        timeDiv.style.display = "block";
      }
    });
  }

  function createBoardUI() {
    let board = document.getElementById('player-board');
    board.innerHTML = '';
    for(let i=1; i<=90; i++) {
      let c = document.createElement('div');
      c.id = 'pb-' + i; c.className = 'b-cell'; c.innerText = i;
      board.appendChild(c);
    }
  }

  function enterPlayerGame() {
    document.getElementById('player-join-view').style.display = 'none';
    document.getElementById('player-view').style.display = 'block';
    document.getElementById('display-game-id').innerText = "Game Number: " + gameId;
    setTimeout(() => { announceVoice(""); }, 100);

    db.ref(`games/${gameId}/tickets/${playerId}`).once('value', snapshot => {
      if(snapshot.exists()) {
        document.getElementById('player-welcome-name').innerText = snapshot.val().name + "'s Tickets";
      } else {
        document.getElementById('player-tickets-area').innerHTML = '<h3 style="color:red;">Error: Ticket not found.</h3>';
      }
    });
    listenToGameState();
  }

  function listenToGameState() {
    db.ref('games/' + gameId).on('value', snapshot => {
      let data = snapshot.val();
      if(!data) return;
      if (data.status === 'ended') {
        document.getElementById('player-view').style.display = 'none';
        document.getElementById('game-over-view').style.display = 'block';
        return;
      }
      let newNum = data.currentDraw;
      let calledNumbers = data.called || [];
      if(newNum > 0) {
        document.getElementById('player-current-num').innerText = newNum;
        if (newNum !== window.lastAnnouncedNumber) {
          announceVoice(newNum);
          window.lastAnnouncedNumber = newNum;
        }
        updateBoardsColors(newNum, calledNumbers);
        updateRecentNumbersUI(calledNumbers); 
      }
    });

    db.ref(`games/${gameId}/tickets/${playerId}`).on('value', snapshot => {
      document.getElementById('player-tickets-area').innerHTML = '';
      if(snapshot.exists()) {
        renderTickets(snapshot.val().data, snapshot.val().name);
      } else {
        document.getElementById('player-tickets-area').innerHTML = '<h3 style="color:red; text-align:center;">Tickets have been Cancelled.</h3>';
      }
    });
  }

  function announceVoice(text) {
    if ('speechSynthesis' in window) {
      setTimeout(() => {
        window.speechSynthesis.cancel();
        let msg = new SpeechSynthesisUtterance(typeof text === 'number' ? "Number is " + text : text);
        msg.lang = 'en-IN'; msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
      }, 10);
    }
  }

  function updateRecentNumbersUI(calledArray) {
    let actualCalls = calledArray.filter(n => n > 0);
    let last5 = actualCalls.slice(-5).reverse(); 
    let html = '';
    last5.forEach((num, index) => html += `<div class="recent-circle${index===0?' latest':''}">${num}</div>`);
    document.getElementById('player-recent-nums').innerHTML = html;
  }

  function updateBoardsColors(current, calledArray) {
    for(let i=1; i<=90; i++) {
      let pCell = document.getElementById('pb-'+i);
      if(pCell) {
        pCell.className = 'b-cell';
        if(i === current) pCell.classList.add('current');
        else if(calledArray.includes(i)) pCell.classList.add('called');
      }
    }
  }

  function renderTickets(ticketsArray, name) {
    let container = document.getElementById('player-tickets-area');
    ticketsArray.forEach((tObj) => {
      let wrap = document.createElement('div'); wrap.className = 'ticket-wrap';
      let headHTML = `<span>${name} - Ticket ${tObj.tNum}</span>`;
      let head = document.createElement('div'); head.className = 't-head'; head.innerHTML = headHTML;
      let grid = document.createElement('div'); grid.className = 't-grid';
      for(let r=0; r<3; r++) {
        for(let c=0; c<9; c++) {
          let cell = document.createElement('div');
          if(tObj.grid[r][c] === 0) { 
            cell.className = 't-cell empty'; 
          } else { 
            cell.className = 't-cell num'; cell.innerText = tObj.grid[r][c]; 
            cell.onclick = function() {
              if (this.classList.contains('marked')) {
                if (confirm("Ee number ni un-tick (deselect) cheyalanukuntunnara?")) this.classList.remove('marked');
              } else {
                this.classList.add('marked');
              }
            };
          }
          grid.appendChild(cell);
        }
      }
      wrap.appendChild(head); wrap.appendChild(grid); container.appendChild(wrap);
    });
  }
</script>
</body>
</html>
