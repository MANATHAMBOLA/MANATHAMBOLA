<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>THAMBOLA TICKET</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background: #f4f6f8; text-align: center;}
  .header { background: #1565c0; color: white; padding: 15px; font-size: 20px; font-weight: bold; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.2);}
  .container { padding: 15px; }
  .btn { width: 100%; padding: 15px; font-size: 18px; color: white; background: #ff9800; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; text-transform: uppercase; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s;}
  .btn:active { transform: scale(0.98); }
  .btn.blue { background: #1976d2; }
  
  /* Full Screen Countdown */
  #countdown-view { position: fixed; top:0; left:0; width:100%; height:100%; background-size: cover; background-position: center; display: none; z-index: 200; justify-content: center; align-items: center; flex-direction: column; }
  .countdown-overlay { position: absolute; width:100%; height:100%; background: rgba(0,0,0,0.7); }
  .countdown-content { position: relative; z-index: 201; color: white; text-align: center; padding: 20px;}
  .timer-text { font-size: 50px; font-weight: bold; color: #ffeb3b; text-shadow: 2px 2px 10px black; margin: 20px 0;}

  /* Game Views */
  .panel { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
  .big-number { font-size: 80px; color: #d32f2f; font-weight: bold; margin: 5px 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
  
  .ticket-wrap { border: 2px solid #1565c0; margin: 15px 0; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05);}
  .t-head { background: #e3f2fd; color: #0d47a1; padding: 10px; font-weight: bold; font-size: 16px;}
  .t-grid { display: grid; grid-template-columns: repeat(9, 1fr); border-top: 2px solid #1565c0; background:#fff;}
  .t-cell { border: 1px solid #e0e0e0; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; user-select: none; }
  .t-cell.empty { background: #fafafa; border-color: transparent; }
  .t-cell.num { cursor: pointer; transition: 0.1s; color: #333;}
  .t-cell.marked { background: #4caf50 !important; color: white !important; border-radius: 50%; transform: scale(0.9);}
  
  .claim-btn { width: 100%; padding: 15px; background: linear-gradient(45deg, #e65100, #ff9800); color: white; border: none; font-size: 18px; font-weight: bold; cursor: pointer;}
  .claim-btn:disabled { opacity: 0.5; background: #9e9e9e; cursor: not-allowed; }

  /* Address Form */
  .input-box { width: 100%; padding: 12px; font-size: 16px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
  
  #toast-container { position: fixed; top: 70px; right: 10px; left: 10px; z-index: 1000; }
  .toast { background: #37474f; color: white; padding: 15px; border-radius: 8px; font-weight: bold; border-left: 5px solid #ffeb3b; box-shadow: 0 4px 10px rgba(0,0,0,0.2); animation: popIn 0.3s; margin-bottom:10px;}
  @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); } }
</style>
</head>
<body>

<div class="header" id="main-header">THAMBOLA BOOK</div>
<div id="toast-container"></div>
<audio id="live-audio" autoplay></audio>

<!-- COUNTDOWN VIEW (WITH GIFT BG) -->
<div id="countdown-view">
  <div class="countdown-overlay"></div>
  <div class="countdown-content">
    <h2>🎉 Grand Tambola Event 🎉</h2>
    <p style="font-size:18px;">Game starts in...</p>
    <div class="timer-text" id="timer-display">00:00:00</div>
    <p>Please wait on this screen.</p>
  </div>
</div>

<!-- JOIN VIEW -->
<div id="player-join-view" class="container">
  <div class="panel" style="margin-top: 50px;">
    <h2 style="color:#1565c0;">Welcome Player!</h2>
    <p>Tap below to connect to the live room.</p>
    <button class="btn blue" onclick="enterPlayerGame()">JOIN GAME NOW</button>
  </div>
</div>

<!-- LIVE PLAY VIEW -->
<div id="player-view" class="container" style="display:none;">
  <div class="panel">
    <h3 id="player-welcome-name" style="margin-top:0; color:#555;"></h3>
    <div id="player-current-num" class="big-number">--</div>
    <div style="color:#e65100; font-weight:bold; margin-top:10px;">MARK 15 NUMBERS TO CLAIM HOUSIE</div>
  </div>
  <div id="player-tickets-area"></div>
</div>

<!-- GAME OVER & ADDRESS FORM -->
<div id="game-over-view" class="container" style="display:none;">
  <div class="panel" style="background: #fff9c4; border: 2px solid #fbc02d;">
    <h2 style="color: #d32f2f; margin-top:0;">🏆 GAME OVER 🏆</h2>
    
    <div id="address-form-area" style="display:none; text-align:left; background:white; padding:15px; border-radius:8px; margin-top:15px;">
      <h3 style="color:#1565c0; text-align:center;">Congratulations! Claim Your Gift</h3>
      <input type="text" id="w-surname" class="input-box" placeholder="Surname (Inti Peru)">
      <input type="text" id="w-name" class="input-box" placeholder="Full Name">
      <input type="tel" id="w-mobile" class="input-box" placeholder="Mobile Number">
      <input type="text" id="w-village" class="input-box" placeholder="Village / City">
      <input type="text" id="w-mandal" class="input-box" placeholder="Mandal">
      <input type="text" id="w-pincode" class="input-box" placeholder="Pincode">
      <textarea id="w-address" class="input-box" placeholder="Full Door No. & Street Address" rows="3"></textarea>
      <button class="btn blue" onclick="submitAddress()">SUBMIT ADDRESS</button>
    </div>

    <h3 style="margin-top:20px;">Winners List</h3>
    <div id="winners-list-container" style="text-align:left;"></div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAvjFcKKiu4OMmQckYXMTejdBJh9tC6TjM",
    authDomain: "sri-vishnu-priya-finance-c591f.firebaseapp.com",
    databaseURL: "https://sri-vishnu-priya-finance-c591f-default-rtdb.firebaseio.com",
    projectId: "sri-vishnu-priya-finance-c591f",
    storageBucket: "sri-vishnu-priya-finance-c591f.firebasestorage.app",
    messagingSenderId: "184676228358",
    appId: "1:184676228358:web:c2b32b68debeeadadfd287"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let gameId, playerId, playerName;
  let calledNumbers = [], currentDrawNumber = 0, rawWinnersData = {}; 
  let isWinnerLocally = false;
  let countdownInterval;

  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('t');

  window.onload = () => {
    if (token) {
      try {
        let decoded = decodeURIComponent(atob(token)); 
        let parts = decoded.split('|');
        gameId = parts[0]; playerId = parts[1];
      } catch(e) { alert("Invalid Link!"); }
    }
  };

  function showToast(msg) {
    let container = document.getElementById('toast-container');
    let toast = document.createElement('div'); toast.className = 'toast';
    toast.innerHTML = msg; container.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
  }

  function enterPlayerGame() {
    new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA').play().catch(e=>{});
    document.getElementById('player-join-view').style.display = 'none';

    db.ref(`games/${gameId}/tickets/${playerId}`).once('value', snap => {
      if(snap.exists()) { playerName = snap.val().name; document.getElementById('player-welcome-name').innerText = "Hello, " + playerName; }
    });

    // Check Start Time First
    db.ref(`games/${gameId}`).once('value', snap => {
      let data = snap.val();
      if(data && data.startTime && data.startTime > Date.now()) {
        startCountdown(data.startTime, data.giftImage);
      } else {
        document.getElementById('player-view').style.display = 'block';
        listenToGameState();
      }
    });
  }

  function startCountdown(timeMs, bgImage) {
    let cv = document.getElementById('countdown-view');
    cv.style.display = 'flex';
    if(bgImage) cv.style.backgroundImage = `url(${bgImage})`;

    countdownInterval = setInterval(() => {
      let now = Date.now();
      let diff = Math.floor((timeMs - now) / 1000);
      
      if(diff <= 0) {
        clearInterval(countdownInterval);
        cv.style.display = 'none';
        document.getElementById('player-view').style.display = 'block';
        listenToGameState();
      } else {
        let h = Math.floor(diff / 3600).toString().padStart(2, '0');
        let m = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
        let s = (diff % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `${h}:${m}:${s}`;
      }
    }, 1000);
  }

  function listenToGameState() {
    db.ref('games/' + gameId).on('value', snap => {
      let data = snap.val(); if(!data) return;
      currentDrawNumber = data.currentDraw; calledNumbers = data.called || [];
      
      if(currentDrawNumber > 0) {
        document.getElementById('player-current-num').innerText = currentDrawNumber;
        if(currentDrawNumber !== window.lastAnnouncedNumber) {
          if('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let msg = new SpeechSynthesisUtterance("Number " + currentDrawNumber);
            msg.rate = 0.9; window.speechSynthesis.speak(msg);
          }
          window.lastAnnouncedNumber = currentDrawNumber;
        }
      }

      if (data.status === 'ended') {
        document.getElementById('player-view').style.display = 'none';
        document.getElementById('game-over-view').style.display = 'block';
        
        let claims = Object.values(rawWinnersData);
        let myWin = claims.find(w => w.name === playerName);
        if(myWin && !localStorage.getItem(`address_submitted_${gameId}`)) {
          document.getElementById('address-form-area').style.display = 'block';
        }
        displayWinners(rawWinnersData);
      }
    });

    db.ref(`games/${gameId}/tickets/${playerId}`).on('value', snap => {
      if(document.getElementById('player-view').style.display === 'none') return;
      document.getElementById('player-tickets-area').innerHTML = '';
      if(snap.exists()) renderTickets(snap.val().data);
    });

    db.ref(`games/${gameId}/winners`).on('child_added', snap => {
      rawWinnersData[snap.key] = snap.val();
      showToast(`🎉 <b>${snap.val().name}</b> claimed Housie!`);
    });

    db.ref(`games/${gameId}/audioStream`).on('value', snap => {
      let val = snap.val();
      if(val && val.data) { document.getElementById('live-audio').src = val.data; }
    });
  }

  function claimHousie(ticketIndex, tObj) {
    let cells = document.querySelectorAll('.ticket-wrap')[ticketIndex].querySelectorAll('.t-cell.num');
    let valid = true;
    cells.forEach(c => {
      let num = parseInt(c.innerText);
      if(!calledNumbers.includes(num) || !c.classList.contains('marked')) valid = false;
    });

    if(valid) {
      db.ref(`games/${gameId}/winners`).push({ name: playerName, tNum: tObj.tNum, time: new Date().toLocaleTimeString() });
      alert("Housie Claimed Successfully! Wait for game to end for address form.");
    } else { alert("Wrong Claim! You missed or falsely marked numbers."); }
  }

  function renderTickets(ticketsArray) {
    let container = document.getElementById('player-tickets-area');
    ticketsArray.forEach((tObj, index) => {
      let wrap = document.createElement('div'); wrap.className = 'ticket-wrap';
      let head = document.createElement('div'); head.className = 't-head'; head.innerText = `Ticket No: ${tObj.tNum}`;
      let grid = document.createElement('div'); grid.className = 't-grid';
      let btn = document.createElement('button'); btn.className = 'claim-btn'; btn.innerText = "CLAIM HOUSIE"; btn.disabled = true;
      
      for(let r=0; r<3; r++) {
        for(let c=0; c<9; c++) {
          let cell = document.createElement('div');
          if(tObj.grid[r][c] === 0) { cell.className = 't-cell empty'; } 
          else { 
            cell.className = 't-cell num'; cell.innerText = tObj.grid[r][c];
            cell.onclick = function() {
              this.classList.toggle('marked');
              btn.disabled = grid.querySelectorAll('.marked').length !== 15;
            };
          }
          grid.appendChild(cell);
        }
      }
      btn.onclick = () => claimHousie(index, tObj);
      wrap.appendChild(head); wrap.appendChild(grid); wrap.appendChild(btn); container.appendChild(wrap);
    });
  }

  function submitAddress() {
    let d = {
      name: document.getElementById('w-name').value,
      surname: document.getElementById('w-surname').value,
      mobile: document.getElementById('w-mobile').value,
      village: document.getElementById('w-village').value,
      mandal: document.getElementById('w-mandal').value,
      pincode: document.getElementById('w-pincode').value,
      address: document.getElementById('w-address').value,
      tNum: Object.values(rawWinnersData).find(w => w.name === playerName).tNum
    };
    if(!d.name || !d.mobile) return alert("Fill Name and Mobile!");
    
    db.ref(`games/${gameId}/winnersDetails/${playerId}`).set(d).then(() => {
      localStorage.setItem(`address_submitted_${gameId}`, "true");
      document.getElementById('address-form-area').innerHTML = "<h3 style='color:green;'>Address Submitted Successfully! Gift will be sent.</h3>";
    });
  }

  function displayWinners(wData) {
    let html = "";
    Object.values(wData).forEach((w, i) => html += `<div style="padding:10px; border-bottom:1px solid #ccc;"><b>Rank ${i+1}:</b> ${w.name} (T.No: ${w.tNum})</div>`);
    document.getElementById('winners-list-container').innerHTML = html || "No Winners";
  }
</script>
</body>
</html>
